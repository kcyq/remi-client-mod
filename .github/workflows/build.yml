name: Build Remi Client Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x ./gradlew && ./gradlew build --stacktrace
      - name: API probe (prints the real 26.1 method names, for development)
        if: always()
        continue-on-error: true
        run: |
          find ~/.gradle .gradle -name "minecraft*.jar" 2>/dev/null | head -20
          JAR=$(find ~/.gradle .gradle -name "minecraft*.jar" 2>/dev/null | grep -iE "client|merged" | grep -iv sources | head -1)
          echo "MC jar: $JAR"
          for c in net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.input.MouseButtonEvent net.minecraft.client.input.KeyEvent net.minecraft.client.input.CharacterEvent net.minecraft.client.gui.components.EditBox net.minecraft.resources.ResourceKey; do
            echo "=== $c"; javap -cp "$JAR" "$c" | grep -v "^Compiled" | head -150
          done
          echo "=== Screen input methods"; javap -cp "$JAR" net.minecraft.client.gui.screens.Screen | grep -iE "mouse|key|char" | head -40
      - name: Pick the mod jar
        run: |
          mkdir out
          cp $(ls build/libs/*.jar | grep -v sources | head -1) out/remi-client-mod.jar
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: remi-client-mod
          path: out/remi-client-mod.jar
      # Remi Client always downloads releases/latest/download/remi-client-mod.jar
      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Remi Client Mod build ${{ github.run_number }}
          make_latest: true
          files: out/remi-client-mod.jar
