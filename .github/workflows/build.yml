name: Build Remi Client Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x ./gradlew && ./gradlew build --stacktrace
      - name: Pick the mod jar
        run: |
          mkdir out
          cp $(ls build/libs/*.jar | grep -v sources | head -1) out/remi-client-mod.jar
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: remi-client-mod
          path: out/remi-client-mod.jar
      # Remi Client always downloads releases/latest/download/remi-client-mod.jar
      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Remi Client Mod build ${{ github.run_number }}
          make_latest: true
          files: out/remi-client-mod.jar
